nodes: 1
tasks_per_node: 1
cpus_per_task: 16
mem_per_gpu: 32G
copy_code: false
folder: ${JEPAWM_CKPT}/lang_goal/online_eval
tag: oracle_reach_eval
eval_name: simu_env_planning
meta:
  quick_debug: false
  seed: 1
  eval_episodes: 20
distributed:
  distribute_multitask_eval: false
  local_rng_samplers: false
  seed_shift: horizon_1000
logging:
  exp_name: oracle_reach_eval
  save_csv: true
  tqdm_silent: false
  optional_plots: false
model_kwargs:
  module_name: app.vjepa_wm.modelcustom.simu_env_planning.vit_enc_preds
  checkpoint: ${JEPAWM_CKPT}/pretrained/mw_jepa-wm.pth.tar
  data:
    dataset_type: custom
    datasets:
      - METAWORLD_HF
    datasets_weights: null
    seed: 1
    img_size: 224
    loader:
      batch_size: 1
      num_workers: 0
      pin_mem: true
      persistent_workers: false
    custom:
      split_ratio: 0.9
      frameskip: 5
      action_skip: 1
      state_skip: 1
      normalize_action: true
      traj_subset: true
      filter_first_episodes:
      filter_tasks: null
      num_hist: 3
      num_pred: 1
      with_reward: false
      custom_teleop_dset: null
  data_aug:
    normalize: [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
  wrapper_kwargs:
    ctxt_window: 2
  pretrain_kwargs:
    grid_size: 16
    tubelet_size_enc: 1
    use_activation_checkpointing: false
    # action_conditioning must be "token" for AdaLN predictor (code assertion)
    action_conditioning: token
    proprio_encoding: feature
    num_frames_pred: 4
    visual_encoder:
      enc_type: dino
      enc_version: dinov2_vits14
      pretrain_enc_path: null
      pretrain_enc_ckpt_key: target_encoder
      embed_dim: 384
      enc_use_rope: null
      enc_name: null
      use_sdpa_enc: true
      num_frames_enc: 16
      uniform_power: true
    action_encoder:
      # action_tokens: 1 for token conditioning (not 0)
      action_tokens: 1
      # action_emb_dim: 0 when action_encoder_inpred is true
      action_emb_dim: 0
      act_mlp: false
      # action_encoder inside predictor (checkpoint structure)
      action_encoder_inpred: true
    proprio_encoder:
      proprio_tokens: 0
      proprio_emb_dim: 16
      prop_mlp: false
      proprio_encoder_inpred: false
    predictor:
      tubelet_size: 1
      pred_num_heads: 16
      pred_depth: 6
      # pred_embed_dim=384, predictor_total_embed_dim=384+16=400
      pred_embed_dim: 384
      pred_use_extrinsics: false
      pred_type: AdaLN
      act_pred_projector: false
      use_SiLU: false
      use_rope: true
    wm_encoding:
      batchify_video: true
      dup_image: false
      normalize_reps: false
    attn:
      local_window_time: 3
      local_window_h: -1
      local_window_w: -1
    heads_cfg:
      architectures: {}
      pretrain_dec_path: {}
task_specification:
  task: mw-reach
  # obs: rgb_state to include proprio features (required for this checkpoint)
  obs: rgb_state
  obs_concat_channels: false
  goal_source: expert
  succ_def: simu
  done_at_succ: false
  max_episode_steps: 100
  goal_H: 6
  num_frames: 1
  num_proprios: 1
  img_size: 224
  env:
    with_target: true
    with_velocity: true
    freeze_rand_vec: false
planner:
  planner_name: cem
  iterations: 15
  num_samples: 300
  num_elites: 10
  horizon: 6
  var_scale: 1.0
  num_act_stepped: 3
  repeat_actskip: false
  decode_each_iteration: false
  distribute_planner: false
  planning_objective:
    objective_type: L2
    sum_all_diffs: false
    alpha: 0.0  # Set to 0 for Lang-Goal (no proprio prediction from GoalHead)
