# Language-Conditioned Goal Head Training Configuration
# ==============================================================================
# This config is for training GoalHead to predict goal latents from
# initial images and language instructions.
# ==============================================================================

# Experiment settings
seed: 42
use_wandb: true
wandb_project: "jepa-lang-goal"

# Training hyperparameters
num_epochs: 100
batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-5
mixed_precision: true
clip_grad: 1.0
save_every: 10

# Loss weights
l2_weight: 1.0
cosine_weight: 0.1

# GoalHead architecture
goal_head:
  visual_dim: 384  # DINOv2 ViT-S output dimension
  text_dim: 384    # SentenceTransformer dimension (will be overwritten)
  output_dim: 384  # Match visual encoder latent dimension
  hidden_dim: 512
  num_layers: 3
  fusion_mode: "concat"  # Options: "concat", "cross_attn", "film"
  num_attention_heads: 8
  dropout: 0.1
  use_proprio: false

# Text encoder configuration
text_encoder:
  type: "sentence_transformer"
  model_name: "all-MiniLM-L6-v2"
  max_seq_length: 128

# Data paths
data_path: "${JEPAWM_DSET}/Metaworld/data"
index_dir: "${JEPAWM_LOGS}/lang_goal/index"
num_workers: 4
use_proprio: false

# Pretrained JEPA-WM checkpoint
pretrained_checkpoint: "${JEPAWM_CKPT}/pretrained/mw_jepa-wm.pth.tar"

# Model configuration for loading pretrained JEPA-WM
# This follows the same pattern as eval configs
model_kwargs:
  module_name: app.vjepa_wm.modelcustom.simu_env_planning.vit_enc_preds
  checkpoint: null  # Will be set from pretrained_checkpoint
  pretrain_kwargs:
    grid_size: 16
    tubelet_size_enc: 1
    use_activation_checkpointing: false
    action_conditioning: token
    proprio_encoding: feature
    num_frames_pred: 4
    visual_encoder:
      enc_type: dino
      enc_version: dinov2_vits14
      pretrain_enc_path: null
      pretrain_enc_ckpt_key: target_encoder
      embed_dim: 384
      enc_use_rope: null
      enc_name: null
      use_sdpa_enc: true
      num_frames_enc: 16
      uniform_power: true
    action_encoder:
      action_tokens: 1
      action_emb_dim: 0
      act_mlp: false
      action_encoder_inpred: true
    proprio_encoder:
      proprio_tokens: 0
      proprio_emb_dim: 16
      prop_mlp: false
      proprio_encoder_inpred: false
    predictor:
      tubelet_size: 1
      pred_num_heads: 16
      pred_depth: 6
      pred_embed_dim: 384
      pred_use_extrinsics: false
      pred_type: AdaLN
      act_pred_projector: false
      use_SiLU: false
      use_rope: true
    wm_encoding:
      batchify_video: true
      dup_image: false
      normalize_reps: false
    rollout_cfg:
      rollout_steps: 2
      train_rollout_prefixes: random
      rollout_stop_gradient: true
      ctxt_window_train_rollout: 3
      do_parallel_rollout: false
      do_sequential_rollout: true
      prepend_gt: false
      sampling_scheduler:
        type: linear
        start: 0.0
        end: 0.0
    attn:
      local_window_time: 3
      local_window_h: -1
      local_window_w: -1
    heads_cfg:
      architectures: {}
      pretrain_dec_path: {}
  data:
    dataset_type: custom
    datasets:
      - METAWORLD_HF
    datasets_weights: null
    seed: 42
    img_size: 224
    validation:
      val_datasets: []
      val_datasets_1: null
      num_frames_val: 18
      val_dataset_batch_size: 4
      val_dataset_drop_last: false
      val_dataset_fpcs: [8]
      val_dataset_camera_views: ["exterior_image_2_left"]
      val_viz_rank0_loader: false
    loader:
      batch_size: 8
      num_workers: 16
      pin_mem: true
      persistent_workers: true
    custom:
      split_ratio: 0.9
      frameskip: 5
      action_skip: 1
      state_skip: 1
      normalize_action: true
      traj_subset: true
      filter_first_episodes: null
      filter_tasks: null
      num_hist: 3
      num_pred: 1
      with_reward: false
      custom_teleop_dset: null
    droid:
      camera_frame: false
      camera_views: [2]
      droid_to_rcasa_action_format: 1
      rcasa_to_droid_action_format: false
      fps: 4
      dataset_fpcs: [8]
      mpk_manifest_patterns: []
  data_aug:
    auto_augment: false
    random_horizontal_flip: false
    motion_shift: false
    random_resize_aspect_ratio: [1.0, 1.0]
    random_resize_scale: [1.777, 1.777]
    reprob: 0.0
    normalize: [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
  wrapper_kwargs:
    ctxt_window: 2
