# Task-to-Text mapping for MetaWorld tasks
# Maps task_id/task_name to natural language instructions
# 
# Format:
#   task_name: "Natural language instruction"
#
# Reference: MetaWorld benchmark (https://zhanpenghe.github.io/publications/meta_world.pdf)

