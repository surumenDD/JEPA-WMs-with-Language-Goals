# ==============================================================================
# Template generation settings
# ==============================================================================
_template:
  # Default template for unknown tasks
  # {task_name} will be replaced with the actual task name
  default: "Complete the {task_name} task"
  
  # Patterns to transform task names to instructions
  patterns:
    - pattern: "(.+)-open"
      template: "Open the {0}"
    - pattern: "(.+)-close"
      template: "Close the {0}"
    - pattern: "(.+)-push"
      template: "Push the {0}"
    - pattern: "(.+)-pull"
      template: "Pull the {0}"
    - pattern: "(.+)-press"
      template: "Press the {0}"
    - pattern: "pick-(.+)"
      template: "Pick up the {0}"
    - pattern: "place-(.+)"
      template: "Place the object at the {0}"
